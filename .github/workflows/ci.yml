name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  release:
    types: [published]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  DOCKER_BUILD_PLATFORMS: >-
    linux/386,
    linux/amd64,
    linux/arm/v6,
    linux/arm/v7,
    linux/arm64/v8,

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Add dependencies
        run: rustup component add clippy
      - name: Build
        run: cargo build --verbose
      - name: Check code
        run: manage/check.sh
      - name: Run integration test
        run: manage/integration_test.sh

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' || github.event_name == 'release' && github.event.action == 'published' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            # Check if semantic version (3 numbers, ignore pre-release and metadata)
            echo "$VERSION" | grep -Po '^\d+\.\d+\.\d+'
          else
            VERSION="0.0.0-SNAPSHOT+$(TZ=Etc/GMT date "+%Y-%m-%dT%H:%M:%SZ")"
          fi
          echo "version=$VERSION" | tee -a $GITHUB_ENV
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: ${{ env.DOCKER_BUILD_PLATFORMS }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=bleeding,enable=${{ github.event_name == 'push' }}
            type=raw,value=stable,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}},value=${{ env.version }},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.version }},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},value=${{ env.version }},enable=${{ github.event_name == 'release' }}
      - name: Build and push to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            APP_VERSION=${{ env.version }}
          platforms: ${{ env.DOCKER_BUILD_PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
